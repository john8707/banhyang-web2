{% load static %}
{% load custom_filters %}

{% url 'new_login' as login_url %}
{% url 'new_signup' as signup_url %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BANHYANG</title>
    <link rel="icon" href="{% static 'image/favicon.png' %}"/>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
    <link rel="stylesheet" href="{% static 'css/new_index.css' %}">    
</head>
<body>
    <div class="image-wrapper">
        {% static "" as baseURL %}
        <img src="{% static 'image/concert' %}{% generate_random 1 3 %}.png" alt="concert image" id="main-image">
        <img src="{% static 'image/logo2.png' %}" alt="logo2" id="logo-image">
    </div>
        
    <div class="login-wrapper">
        <div class="login-wrapper2">

            <div class="icon-wrapper">
                <div class="title1">
                    BANHYANG
                </div>
                <div class="title2">
                    YONSEI UNIV ROCK BAND
                </div>
                
            </div>
            <div class="button-wrapper">
                <a href="{{ login_url }}" class="login-link">
                    <div class="login-button">LOGIN</div>
                </a>
                <a href="{{ signup_url }}" class="login-link">
                    <div class="login-button">SIGN UP</div>
                </a>
                <a href="" class="login-link" onclick="aboutUs()">
                    <div class="login-button">ABOUT US</div>
                </a>
            </div>
        </div>
    </div>


    <div class="footer">
        Copyright 2020. YONSEI UNIVERSITY ROCKBAND BANHYANG 34th Jaewon LIM. ALL RIGHTS RESERVED.
    </div>

    <script>
        function aboutUs(){
            alert("나락도 락이다~")
        }
    </script>
</body>
</html>
