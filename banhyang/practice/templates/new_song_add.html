        <input type="button" value="추가" class="button-add">

<script>
document.addEventListener('DOMContentLoaded', () => {
    // 테이블 전체를 감싸는 컨테이너를 선택합니다.
    const tableWrapper = document.querySelector('.main-table-wrapper');
    
    // '추가' 버튼 컨테이너를 선택합니다. 새 행은 이 컨테이너 앞에 추가됩니다.
    const buttonWrapper = document.querySelector('.button-wrapper');

    // 행을 추가하는 함수
    const addNewRow = (currentRow) => {
        // 현재 행을 그대로 복제합니다. (true는 자식 요소까지 모두 복제)
        const newRow = currentRow.cloneNode(true);
        
        // 복제된 행의 모든 input 필드를 찾아서 값을 비웁니다.
        newRow.querySelectorAll('input[type="text"]').forEach(input => {
            input.value = '';
        });

        // 복제된 행이 또다시 행을 추가할 수 있도록, 상태를 표시하는 클래스를 제거합니다.
        newRow.classList.remove('row-dirty');
        
        // '추가' 버튼 바로 위에 복제된 빈 행을 삽입합니다.
        tableWrapper.insertBefore(newRow, buttonWrapper);
    };

    // 테이블 컨테이너에 'input' 이벤트 리스너를 추가합니다 (이벤트 위임).
    tableWrapper.addEventListener('input', (event) => {
        // 이벤트가 발생한 요소가 input 태그인지 확인합니다.
        if (event.target.tagName === 'INPUT') {
            // 이벤트가 발생한 input을 포함하는 가장 가까운 행(.main-table-tr)을 찾습니다.
            const currentRow = event.target.closest('.main-table-tr');

            // 해당 행이 유효하고, 아직 새로운 행을 추가한 적이 없는 경우에만 실행합니다.
            // 'row-dirty' 클래스는 행이 한 번이라도 수정되었음을 나타내는 표시입니다.
            if (currentRow && !currentRow.classList.contains('row-dirty')) {
                // 이 행은 이제 수정되었으므로, 'row-dirty' 클래스를 추가하여 중복 추가를 방지합니다.
                currentRow.classList.add('row-dirty');
                
                // 새로운 빈 행을 추가하는 함수를 호출합니다.
                addNewRow(currentRow);
            }
        }
    });
});
</script>
