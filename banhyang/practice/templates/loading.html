{% extends 'base.html' %}
{% block content %}
<div class="practice_container">
    {% include 'nav.html' %}
    <div class="setting_form" style="text-align: center; margin-top: 100px;">
        <h2 style="color: #0d6efd; font-weight: bold;">최적의 시간표를 짜고 있습니다...</h2>
        <p style="margin-top: 20px; color: #555;">(약 1분 정도 소요됩니다. 창을 닫지 마세요!)</p>
    </div>
</div>

<script>
    const taskId = "{{ task_id }}";
    
    function checkStatus() {
        fetch(`/practice/timetable/status/${taskId}`)
            .then(response => response.json())
            .then(data => {
                if (data.state === 'SUCCESS') {
                    // 완료되면 결과 SSR 렌더링 뷰로 강제 이동!
                    window.location.href = `/practice/timetable/result/${taskId}`;
                } else if (data.state === 'FAILURE') {
                    alert("시간표 생성 중 오류가 발생했습니다. 개발자에게 문의하세요.");
                } else {
                    // 아직 연산 중이면 3초 뒤에 다시 물어봄
                    setTimeout(checkStatus, 3000);
                }
            });
    }

    setTimeout(checkStatus, 3000);
</script>
{% endblock %}
